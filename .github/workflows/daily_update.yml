name: Daily Market Data Update & Deployment

on:
  schedule:
    # Morning & afternoon trading sessions (IST is UTC + 5:30)
    # Uses off-peak minutes to avoid GitHub Actions scheduling congestion.
    - cron: '32 04 * * 1-5'  # 10:02 IST (10:02 AM IST)
    - cron: '32 05 * * 1-5'  # 11:02 IST (11:02 AM IST)
    - cron: '32 06 * * 1-5'  # 12:02 IST (12:02 PM IST)
    - cron: '32 07 * * 1-5'  # 13:02 IST (1:02 PM IST)
    - cron: '32 08 * * 1-5'  # 14:02 IST (2:02 PM IST)
    - cron: '02 09 * * 1-5'  # 14:32 IST (2:32 PM IST)
    - cron: '32 09 * * 1-5'  # 15:02 IST (3:02 PM IST)
    - cron: '02 10 * * 1-5'  # 15:32 IST (3:32 PM IST)
    - cron: '32 10 * * 1-5'  # 16:02 IST (4:02 PM IST)
    - cron: '02 11 * * 1-5'  # 16:32 IST (4:32 PM IST)
    # Closing window updates
    - cron: '32 11 * * 1-5'  # 17:02 IST (5:02 PM IST)
    - cron: '47 11 * * 1-5'  # 17:17 IST (5:17 PM IST)
    - cron: '59 11 * * 1-5'  # 17:29 IST (5:29 PM IST final closing sweep)
    # Evening backups
    - cron: '30 12 * * 1-5'  # 18:00 IST (6:00 PM IST)
    - cron: '30 13 * * 1-5'  # 19:00 IST (7:00 PM IST)
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to ingest'
        required: false
        default: '7'
  repository_dispatch:
    types: [daily_market_update]

# Permissions required to commit and push changes back to the repository
permissions:
  contents: write

concurrency:
  group: daily-market-ingest
  # Let a deployment finish verification before another refresh can replace it.
  # GitHub keeps at most the latest pending run in this concurrency group.
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test deployment verification
        run: |
          python -m unittest discover -s tests
          node tests/test_chart_rendering.cjs

      - name: Ingest Market Data
        env:
          # Default to 7 days so that any delayed run or missed dates are automatically healed
          DAYS: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.days || '7' }}
          TZ: Asia/Kolkata
        run: |
          git pull --ff-only origin main
          echo "Running market ingestion for the last $DAYS days..."
          python -m app.ingest --days "$DAYS" --strict

      - name: Build Static Dashboard Bundle
        run: |
          echo "Baking static site to ./public..."
          python -m app.publish

      - name: Commit & Push Updated Data to GitHub
        id: commit_step
        run: |
          git config user.name "Swayamjit Dalai"
          git config user.email "swayamjitdalai-bit@users.noreply.github.com"
          
          # Stage the updated database, CSV, and baked static assets
          git add data/market.db data/cbrics.csv public/ vercel.json
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected. Everything is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NOW_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Auto market data update: $NOW_UTC"
            git push origin main
            echo "Successfully pushed updated market data to main branch."
          fi

      - name: Verify live Vercel deployment
        run: python -u -m app.verify_deploy --timeout 900

      - name: Publish Summary to GitHub Actions
        run: |
          echo "### 📊 Daily Market Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Time (IST):** $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M %p %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Ingest:** ✅ CCIL F-TRAC, CCIL Money Market, FBIL OIS, Brent Oil, NSE CBRICS" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Publish:** ✅ Generated ./public dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Push:** ${{ steps.commit_step.outputs.has_changes == 'true' && '✅ Updated data committed and pushed to main' || 'ℹ️ No data change' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel Live Status:** Production files verified against this refresh" >> $GITHUB_STEP_SUMMARY
