name: Daily Market Data Update & Deployment

on:
  schedule:
    # 11:45 UTC = 17:15 IST (5:15 PM India Standard Time)
    - cron: '45 11 * * *'
    # 12:00 UTC = 17:30 IST (5:30 PM IST)
    - cron: '0 12 * * *'
    # 12:30 UTC = 18:00 IST (6:00 PM IST)
    - cron: '30 12 * * *'
    # 13:15 UTC = 18:45 IST (6:45 PM IST) secondary evening sweep for late filings
    - cron: '15 13 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to ingest'
        required: false
        default: '7'

# Permissions required to commit and push changes back to the repository
permissions:
  contents: write

concurrency:
  group: daily-market-ingest
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Market Data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          echo "Running market ingestion for the last $DAYS days..."
          python -m app.ingest --days "$DAYS"

      - name: Build Static Dashboard Bundle
        run: |
          echo "Baking static site to ./public..."
          python -m app.publish

      - name: Commit & Push Updated Data to GitHub
        id: commit_step
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage the updated database, CSV, and baked static assets
          git add -f data/market.db data/cbrics.csv public/ vercel.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected. Everything is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NOW_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Auto market data update: $NOW_UTC"
            git push origin main
            echo "Successfully pushed updated market data to main branch."
          fi

      - name: Deploy to Vercel (CLI)
        if: env.VERCEL_TOKEN != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          echo "Deploying to Vercel via Vercel CLI..."
          npx vercel deploy --prod --yes --token="$VERCEL_TOKEN"

      - name: Trigger Vercel Deploy Hook (Alternative)
        if: env.VERCEL_TOKEN == '' && env.VERCEL_DEPLOY_HOOK != ''
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          echo "Triggering Vercel Deploy Hook..."
          curl -s -X POST "$VERCEL_DEPLOY_HOOK" -o /dev/null -w "HTTP Status: %{http_code}\n"

      - name: Publish Summary to GitHub Actions
        run: |
          echo "### 📊 Daily Market Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Time (IST):** $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M %p %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Ingest:** ✅ CCIL F-TRAC, CCIL Money Market, FBIL OIS, Brent Oil, NSE CBRICS" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Publish:** ✅ Generated ./public dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Push:** ${{ steps.commit_step.outputs.has_changes == 'true' && '✅ Updated data committed and pushed to main' || 'ℹ️ No data change' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel / Streamlit Live Status:** ✅ Refreshed automatically" >> $GITHUB_STEP_SUMMARY
