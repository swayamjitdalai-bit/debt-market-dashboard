name: Daily Market Data Update & Deployment

on:
  schedule:
    # Every 15 minutes from 2:00 PM to 5:15 PM IST, plus 5:20 PM IST.
    # (IST is UTC+5:30; GitHub may start scheduled jobs a few minutes late.)
    - cron: '30,45 08 * * 1-5'  # 14:00, 14:15 IST
    - cron: '00,15,30,45 09 * * 1-5'  # 14:30–15:15 IST
    - cron: '00,15,30,45 10 * * 1-5'  # 15:30–16:15 IST
    - cron: '00,15,30,45 11 * * 1-5'  # 16:30–17:15 IST
    - cron: '50 11 * * 1-5'  # 17:20 IST
  workflow_dispatch:
    inputs:
      days:
        description: 'Number of past days to ingest'
        required: false
        default: '7'
  repository_dispatch:
    types: [daily_market_update]

# Permissions required to commit and push changes back to the repository
permissions:
  contents: write

concurrency:
  group: daily-market-ingest
  # Let a slow source fetch complete; cancelling it at the next interval left
  # the dashboard with an incomplete update.
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ingest Market Data
        run: |
          DAYS="${{ github.event.inputs.days || '7' }}"
          echo "Running market ingestion for the last $DAYS days..."
          python -m app.ingest --days "$DAYS"

      - name: Build Static Dashboard Bundle
        run: |
          echo "Baking static site to ./public..."
          python -m app.publish

      - name: Commit & Push Updated Data to GitHub
        id: commit_step
        run: |
          git config user.name "Swayamjit Dalai"
          git config user.email "swayamjitdalai-bit@users.noreply.github.com"
          
          # Stage the updated database, CSV, and baked static assets
          git add -f data/market.db data/cbrics.csv public/ vercel.json 2>/dev/null || true
          
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No data changes detected. Everything is up to date."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            NOW_UTC=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "Auto market data update: $NOW_UTC"
            git pull --rebase -X theirs origin main || true
            git push origin main
            echo "Successfully pushed updated market data to main branch."
          fi

      - name: Publish Summary to GitHub Actions
        run: |
          echo "### 📊 Daily Market Update Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Time (IST):** $(TZ='Asia/Kolkata' date '+%Y-%m-%d %I:%M %p %Z')" >> $GITHUB_STEP_SUMMARY
          echo "- **Data Ingest:** ✅ CCIL F-TRAC, CCIL Money Market, FBIL OIS, Brent Oil, NSE CBRICS" >> $GITHUB_STEP_SUMMARY
          echo "- **Static Publish:** ✅ Generated ./public dashboard" >> $GITHUB_STEP_SUMMARY
          echo "- **Git Push:** ${{ steps.commit_step.outputs.has_changes == 'true' && '✅ Updated data committed and pushed to main' || 'ℹ️ No data change' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Vercel Live Status:** ✅ Auto-deployed to production" >> $GITHUB_STEP_SUMMARY
